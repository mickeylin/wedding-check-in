<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <style>
    :root {
      font-family: Arial, "Noto Sans TC", sans-serif;
      color: #222;
      background: #f6f4f1;
    }
    body {
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 3px 16px rgba(0, 0, 0, 0.08);
    }
    h1, h2, p {
      margin-top: 0;
    }
    .muted {
      color: #777;
      font-size: 14px;
    }
    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: #ece8e3;
      font-size: 13px;
      white-space: nowrap;
    }
    .badge.done {
      background: #dff3e4;
    }
    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: 700;
    }
    input, select, textarea, button {
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      border-radius: 10px;
    }
    input, select, textarea {
      border: 1px solid #ccc;
      padding: 11px 12px;
      background: #fff;
    }
    textarea {
      min-height: 80px;
      resize: vertical;
    }
    button {
      border: 0;
      padding: 12px 14px;
      cursor: pointer;
      background: #1f1f1f;
      color: #fff;
      font-weight: 700;
      margin-top: 12px;
    }
    button.secondary {
      background: #ebe7e2;
      color: #222;
    }
    button.link {
      background: transparent;
      color: #555;
      width: auto;
      padding: 4px 0;
      margin: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .result {
      border-top: 1px solid #eee;
      padding: 12px 0;
      cursor: pointer;
    }
    .result:first-child {
      border-top: 0;
    }
    .big-name {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .table-no {
      font-size: 22px;
      font-weight: 800;
    }
    .status {
      padding: 10px 12px;
      border-radius: 10px;
      background: #fff6d9;
      margin: 12px 0;
    }
    .status.success {
      background: #dff3e4;
    }
    .status.info {
      background: #eef3ff;
    }
    .hidden {
      display: none !important;
    }
    .loading {
      opacity: .55;
      pointer-events: none;
    }
    .error {
      color: #a30000;
      white-space: pre-wrap;
    }
    @media (max-width: 560px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="title-row">
      <div>
        <h1>婚禮報到</h1>
        <div id="headerSubtitle" class="muted">請交由接待人員協助報到</div>
      </div>
      <button class="link" onclick="resetPage()">重新整理</button>
    </div>
  </div>

  <div id="welcomeCard" class="card">
    <h2>請交由接待人員協助報到</h2>
    <p class="muted">
      這是婚禮報到識別碼。工作人員會使用已授權的 Google 帳號完成報到與收禮登錄。
    </p>
    <div id="authStatus" class="status info">正在確認 Google 帳號...</div>
    <button id="retryButton" class="secondary hidden" onclick="resetPage()">重新確認</button>
  </div>

  <div id="searchCard" class="card hidden">
    <div class="title-row">
      <h2>姓名搜尋</h2>
      <span id="staffBadge" class="badge"></span>
    </div>
    <div class="grid">
      <div>
        <input id="keyword" placeholder="姓名、賓客 ID、桌號或分組"
               onkeydown="if(event.key==='Enter') searchGuests()">
      </div>
      <div>
        <button style="margin-top:0" onclick="searchGuests()">搜尋</button>
      </div>
    </div>
    <div id="results"></div>
  </div>

  <div id="guestCard" class="card hidden">
    <div class="title-row">
      <div>
        <div id="displayName" class="big-name"></div>
        <div id="partyName" class="muted"></div>
      </div>
      <div id="checkinBadge" class="badge"></div>
    </div>

    <div class="grid" style="margin-top:16px">
      <div>
        <div class="muted">桌號</div>
        <div id="tableNo" class="table-no"></div>
      </div>
      <div>
        <div class="muted">預計人數</div>
        <div id="expectedCount" class="table-no"></div>
      </div>
    </div>

    <div id="existingStatus" class="status hidden"></div>

    <label for="actualCount">實到人數</label>
    <input id="actualCount" type="number" min="0" max="30" inputmode="numeric">

    <label for="giftStatus">收禮狀態</label>
    <select id="giftStatus" onchange="toggleGiftFields()">
      <option value="未收禮">未收禮</option>
      <option value="已收禮">已收禮</option>
      <option value="代包">代包</option>
      <option value="免禮">免禮</option>
    </select>

    <div id="giftFields">
      <div class="grid">
        <div>
          <label for="giftAmount">禮金金額</label>
          <input id="giftAmount" type="number" min="0" step="100" inputmode="numeric">
        </div>
        <div>
          <label for="envelopeNo">紅包編號</label>
          <input id="envelopeNo" placeholder="例如 A023">
        </div>
      </div>
    </div>

    <label for="operatorDisplay">操作人員</label>
    <input id="operatorDisplay" readonly>

    <label for="notes">備註</label>
    <textarea id="notes" placeholder="臨時換桌、由誰代包等"></textarea>

    <button id="saveButton" onclick="saveCheckin()">完成報到</button>
    <button class="secondary" onclick="backToSearch()">返回搜尋</button>
    <p id="formError" class="error"></p>
  </div>
</div>

<script>
  const INITIAL_TOKEN = <?!= JSON.stringify(initialToken) ?>;
  const INITIAL_GUEST = <?!= JSON.stringify(initialGuest) ?>;
  const INITIAL_ERROR = <?!= JSON.stringify(initialError) ?>;
  const state = {
    staff: {
      email: 'speed-test',
      name: '測試模式'
    },
    guest: null
  };

  document.addEventListener('DOMContentLoaded', () => {
    showMain();
  });

  function showMain() {
    document.getElementById('welcomeCard').classList.add('hidden');
    document.getElementById('searchCard').classList.remove('hidden');
    document.getElementById('headerSubtitle').textContent = '掃 QR Code 或搜尋姓名';
    document.getElementById('staffBadge').textContent =
      state.staff ? state.staff.name : '';
    if (INITIAL_GUEST) {
      renderGuest(INITIAL_GUEST);
      autoCheckinIfNeeded(INITIAL_GUEST);
    } else if (INITIAL_ERROR) {
      alert(INITIAL_ERROR);
    } else if (INITIAL_TOKEN) {
      loadGuest(INITIAL_TOKEN, true);
    }
  }

  function loadGuest(token, shouldAutoCheckin) {
    setLoading(true);
    google.script.run
      .withSuccessHandler(guest => {
        renderGuest(guest);
        if (shouldAutoCheckin) {
          autoCheckinIfNeeded(guest);
        }
        setLoading(false);
      })
      .withFailureHandler(err => {
        alert(messageOf(err));
        backToSearch();
        setLoading(false);
      })
      .getGuestByToken(token);
  }

  function autoCheckinIfNeeded(guest) {
    if (!guest || !guest.token || guest.checkinStatus === '已報到') return;

    const existing = document.getElementById('existingStatus');
    existing.classList.remove('hidden');
    existing.className = 'status info';
    existing.textContent = '正在自動報到... 禮金與紅包資料可稍後補登。';

    google.script.run
      .withSuccessHandler(updatedGuest => {
        renderGuest(updatedGuest);
        document.getElementById('existingStatus').classList.remove('hidden');
        document.getElementById('existingStatus').className = 'status success';
        document.getElementById('existingStatus').innerHTML =
          '已自動報到成功。<br>禮金、紅包編號與實到人數可稍後補登或修正。';
      })
      .withFailureHandler(err => {
        document.getElementById('existingStatus').classList.remove('hidden');
        document.getElementById('existingStatus').className = 'status';
        document.getElementById('existingStatus').textContent =
          '自動報到尚未完成：' + messageOf(err);
      })
      .autoCheckinByToken(guest.token);
  }

  function searchGuests() {
    const keyword = document.getElementById('keyword').value.trim();
    if (!keyword) return;

    setLoading(true);
    google.script.run
      .withSuccessHandler(items => {
        const results = document.getElementById('results');
        if (!items.length) {
          results.innerHTML = '<p class="muted">找不到符合資料</p>';
        } else {
          results.innerHTML = items.map(item => `
            <div class="result" onclick="loadGuest('${escapeJs(item.token)}', false)">
              <strong>${escapeHtml(item.displayName)}</strong>
              <div class="muted">
                ${escapeHtml(item.guestId)}｜第 ${escapeHtml(item.tableNo)} 桌｜
                ${escapeHtml(item.partyName || item.group || '')}
              </div>
            </div>
          `).join('');
        }
        setLoading(false);
      })
      .withFailureHandler(err => {
        document.getElementById('results').innerHTML =
          `<p class="error">${escapeHtml(messageOf(err))}</p>`;
        setLoading(false);
      })
      .searchGuests(keyword);
  }

  function renderGuest(guest) {
    state.guest = guest;
    document.getElementById('searchCard').classList.add('hidden');
    document.getElementById('guestCard').classList.remove('hidden');

    document.getElementById('displayName').textContent = guest.displayName;
    document.getElementById('partyName').textContent =
      [guest.partyName, guest.side, guest.group].filter(Boolean).join('｜');
    document.getElementById('tableNo').textContent = guest.tableNo || '未排';
    document.getElementById('expectedCount').textContent = guest.expectedCount || 0;

    const badge = document.getElementById('checkinBadge');
    badge.textContent = guest.checkinStatus || '未報到';
    badge.className = 'badge' + (guest.checkinStatus === '已報到' ? ' done' : '');

    const existing = document.getElementById('existingStatus');
    if (guest.checkinStatus === '已報到') {
      existing.classList.remove('hidden');
      existing.className = 'status success';
      existing.innerHTML =
        `此賓客已報到。<br>` +
        `時間：${escapeHtml(guest.checkinTime || '未記錄')}<br>` +
        `操作人員：${escapeHtml(guest.operator || '未記錄')}<br>` +
        `目前收禮狀態：${escapeHtml(guest.giftStatus || '未收禮')}`;
      document.getElementById('saveButton').textContent = '更新報到資料';
    } else {
      existing.classList.add('hidden');
      document.getElementById('saveButton').textContent = '完成報到';
    }

    document.getElementById('actualCount').value =
      guest.actualCount || guest.expectedCount || 1;
    document.getElementById('giftStatus').value =
      guest.giftStatus || '未收禮';
    document.getElementById('giftAmount').value =
      guest.giftAmount || '';
    document.getElementById('envelopeNo').value =
      guest.envelopeNo || '';
    document.getElementById('operatorDisplay').value =
      state.staff ? `${state.staff.name} (${state.staff.email})` : '';
    document.getElementById('notes').value =
      guest.notes || '';
    document.getElementById('formError').textContent = '';
    toggleGiftFields();
  }

  function saveCheckin() {
    if (!state.guest) return;

    const payload = {
      token: state.guest.token,
      actualCount: Number(document.getElementById('actualCount').value || 0),
      giftStatus: document.getElementById('giftStatus').value,
      giftAmount: Number(document.getElementById('giftAmount').value || 0),
      envelopeNo: document.getElementById('envelopeNo').value.trim(),
      notes: document.getElementById('notes').value.trim()
    };

    setLoading(true);

    google.script.run
      .withSuccessHandler(guest => {
        renderGuest(guest);
        document.getElementById('existingStatus').innerHTML =
          '已成功儲存報到資料';
        setLoading(false);
      })
      .withFailureHandler(err => {
        document.getElementById('formError').textContent = messageOf(err);
        setLoading(false);
      })
      .saveCheckin(payload);
  }

  function toggleGiftFields() {
    const status = document.getElementById('giftStatus').value;
    const show = status === '已收禮' || status === '代包';
    document.getElementById('giftFields').classList.toggle('hidden', !show);
    if (!show) {
      document.getElementById('giftAmount').value = '';
      document.getElementById('envelopeNo').value = '';
    }
  }

  function backToSearch() {
    state.guest = null;
    document.getElementById('guestCard').classList.add('hidden');
    document.getElementById('searchCard').classList.remove('hidden');
    document.getElementById('keyword').focus();
  }

  function resetPage() {
    location.href = location.href.split('?')[0];
  }

  function setLoading(isLoading) {
    document.body.classList.toggle('loading', isLoading);
  }

  function messageOf(err) {
    return (err && err.message) ? err.message : String(err || '發生錯誤');
  }

  function escapeHtml(value) {
    return String(value || '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function escapeJs(value) {
    return String(value || '')
      .replaceAll('\\', '\\\\')
      .replaceAll("'", "\\'");
  }
</script>
</body>
</html>
