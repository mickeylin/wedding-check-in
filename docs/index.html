<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>婚禮禮金簿</title>
  <link rel="stylesheet" href="./styles.css?v=0c65474dce2d">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>婚禮禮金簿</h1>
      <p>查桌號・收到紅包後再登記</p>
    </div>
    <div class="header-status"><span id="operatorStatus"></span><a id="connectionStatus" class="status-pill" href="#syncTitle">未設定</a></div>
  </header>

  <main class="layout">
    <details id="settingsPanel" class="panel setup-panel" open>
      <summary id="settingsTitle">登入與設定 <span id="settingsHint">開始前請先登入</span></summary>
      <p class="setup-help">網址與姓名會保留在這台裝置；重新開啟分頁時可能需要再次登入。更新名單也可在此操作。</p>

      <label for="apiUrl">Apps Script API URL</label>
      <input id="apiUrl" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec">

      <label for="pin">工作人員 PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off">
      <label for="operator">操作人員</label>
      <input id="operator" type="text" placeholder="例如：小美">

      <button id="saveSettingsButton" class="secondary-button" type="button">登入並更新名單</button>
    </details>
    <div id="resultBox" class="result-box neutral" role="status" aria-live="polite">
      <strong>準備接待</strong><span>先登入下載名單，即可掃描或查找賓客。</span>
    </div>

    <section class="panel scanner-panel" aria-labelledby="scannerTitle">
      <div class="section-header">
        <h2 id="scannerTitle">掃 QR ／輸入編號</h2>
        <div class="button-row">
          <button id="startButton" type="button">開始掃描</button>
          <button id="stopButton" class="secondary-button" type="button" disabled>停止</button>
        </div>
      </div>

      <div id="reader" hidden></div>

      <form id="manualForm" class="manual-form">
        <label for="manualGuestId">賓客編號</label>
        <div class="manual-row">
          <input id="manualGuestId" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="例如 g001">
          <button type="submit">查詢</button>
        </div>
      </form>
    </section>

    <section class="panel lookup-panel" aria-labelledby="lookupTitle">
      <div class="section-header">
        <div>
          <h2 id="lookupTitle">用姓名找賓客</h2>
          <p>輸入姓名／稱呼，或直接選分類。</p>
        </div>
      </div>

      <form id="lookupForm" class="lookup-form">
        <label for="lookupQuery">姓名／稱呼（可選）</label>
        <input id="lookupQuery" type="search" autocomplete="off" placeholder="可不填，直接選分類">

        <label for="lookupCategory">關係分類</label>
        <select id="lookupCategory">
          <option value="">全部分類</option>
          <option value="男方家人">男方家人</option>
          <option value="男方朋友">男方朋友（含共同朋友）</option>
          <option value="共同朋友">共同朋友</option>
          <option value="男方同事">男方同事</option>
          <option value="女方家人">女方家人</option>
          <option value="女方媽媽同事">女方媽媽同事</option>
          <option value="女方朋友">女方朋友（含共同朋友）</option>
          <option value="女方同事">女方同事</option>
        </select>

        <button type="submit">查找賓客</button>
      </form>

      <p id="lookupStatus" class="lookup-status" aria-live="polite"></p>
      <div id="lookupResults" class="lookup-results" aria-live="polite"></div>
    </section>

    <section class="panel sync-panel" aria-labelledby="syncTitle">
      <div class="section-header">
        <div>
          <h2 id="syncTitle">紅包同步</h2>
          <p id="giftQueueSummary" aria-live="polite">沒有待同步紀錄</p>
        </div>
        <button id="retryGiftQueueButton" class="secondary-button compact-button" type="button">立即重試</button>
      </div>
      <p class="sync-help">看到「已保存在手機」就能處理下一位；「已同步」才代表資料已進入 Google Sheet。</p>
      <details id="queueDetails"><summary>查看同步紀錄</summary>
      <ol id="giftQueueList" class="sync-list" aria-live="polite"></ol></details>
      <button id="clearCompletedGiftQueueButton" class="secondary-button" type="button" hidden>清除完成紀錄</button>
    </section>
    <details class="panel history-panel"><summary>最近操作</summary><ol id="recentList" class="recent-list"></ol></details>
  </main>

  <div
    id="checkinModal"
    class="checkin-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="checkinModalTitle"
    hidden
  >
    <div id="checkinModalCard" class="checkin-modal-card neutral">
      <p class="eyebrow">目前賓客</p>
      <h2 id="checkinModalTitle" tabindex="-1">賓客資訊</h2>
      <div id="guestFacts" class="guest-facts" hidden>
        <div><span>桌號</span><strong id="guestTable"></strong></div>
        <div><span>紅包標記・賓客編號</span><strong id="guestCode"></strong></div>
      </div>
      <p id="checkinModalMessage"></p>

      <button id="receiveButton" type="button" hidden>收到紅包</button>
      <button id="cancelReceiptButton" class="secondary-button" type="button" hidden>撤銷誤收件</button>
      <button id="nextGuestButton" class="secondary-button" type="button">下一位</button>
      <details class="timing-details">
        <summary>查看本次耗時</summary>
        <p id="timingStatus">尚無量測資料</p>
      </details>
    </div>
  </div>

  <!-- Update the content-hash version when changing each local asset. -->
  <script src="./checkin-gate.js?v=5bdec7e233a6"></script>
  <script src="./gift-queue.js?v=610add030021"></script>
  <script src="./app.js?v=3df1b8fb478d"></script>
</body>
</html>
